<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Добротворский Сергей — «СКАЗКА» фабрика аттракционов</title>

<style>
:root{--red:#C90A02;--black:#050505;--white:#fff;--text:#171717;--muted:#777;--line:#e8e8e8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:var(--text)}
body{
  min-height:100svh;overflow-x:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.page{
  width:100%;max-width:430px;min-height:100svh;margin:0 auto;
  padding:0 22px max(28px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;background:#fff;
}
.header{
  width:calc(100% + 44px);
  margin-left:-22px;margin-right:-22px;
  min-height:118px;
  padding:max(10px,env(safe-area-inset-top)) 22px 22px;
  display:flex;align-items:flex-start;justify-content:center;
  background:#050505;
}
.logo{width:min(78%,290px);height:auto;display:block;margin:0 auto}
.photo-wrap{
  width:174px;height:174px;border-radius:50%;padding:4px;background:var(--red);
  box-shadow:0 0 0 6px rgba(201,10,2,.10),0 12px 30px rgba(0,0,0,.16);
  margin:22px auto 22px;position:relative;z-index:2;
}
.photo{
  width:100%;height:100%;display:block;border-radius:50%;
  object-fit:cover;object-position:center 26%;border:3px solid #fff;background:#eee;
}
.name{
  margin:0;text-align:center;color:#111;
  font-size:42px;line-height:.98;letter-spacing:-1.7px;font-weight:800;
}
.position{margin:14px 0 5px;color:#333;font-size:17px;font-weight:600;text-align:center}
.company{margin:0 0 27px;color:var(--red);font-size:15px;font-weight:700;text-align:center}
.slogan{
  margin:8px 0 27px;color:#777;font-size:12px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;text-align:center;
}
.contacts{width:100%;display:grid;gap:10px}
.contact{
  width:100%;min-height:61px;padding:10px 13px;display:flex;align-items:center;gap:13px;
  color:#111;text-decoration:none;background:#fff;border:1px solid var(--line);
  border-radius:17px;box-shadow:0 4px 15px rgba(0,0,0,.045);
  -webkit-tap-highlight-color:transparent;
}
.contact:active{transform:scale(.99)}
.icon{
  width:40px;height:40px;flex:0 0 40px;border-radius:12px;
  display:grid;place-items:center;background:var(--red);
}
.icon svg{width:21px;height:21px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.meta{min-width:0}
.label{
  display:block;color:#999;font-size:10px;line-height:1.2;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;margin-bottom:3px;
}
.value{
  display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:#151515;font-size:15px;font-weight:650;
}
.save{
  width:100%;min-height:61px;margin-top:19px;border:0;border-radius:17px;
  background:var(--red);color:#fff;font:inherit;font-size:17px;font-weight:800;
  box-shadow:0 10px 26px rgba(201,10,2,.22);-webkit-tap-highlight-color:transparent;cursor:pointer;
}
.save:active{transform:scale(.99)}
.save svg{
  width:21px;height:21px;vertical-align:-5px;margin-right:8px;
  fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.ios-note{margin:13px 0 0;color:#999;font-size:12px;line-height:1.45;text-align:center}
.footer{
  margin-top:24px;color:#aaa;font-size:11px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;text-align:center;
}
@media(max-width:370px){
  .page{padding-left:15px;padding-right:15px}
  .header{width:calc(100% + 30px);margin-left:-15px;margin-right:-15px;padding-left:15px;padding-right:15px}
  .logo{width:300px}.photo-wrap{width:154px;height:154px}.name{font-size:36px}
}
</style>
</head>

         The temporary link still uses the required download attribute. */
      a.target = "_self";
    }

    a.click();

    setTimeout(function(){
      a.remove();
      URL.revokeObjectURL(objectURL);
    }, 5000);
  });
})();
</script>
</body>
